  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#7dd3fc" font-size="17" letter-spacing="6" font-weight="600">NETWORK ASSURANCE PLATFORM</text>
    <text x="70" y="206" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1">NetHealth</text>
    <text x="73" y="247" fill="#9fc2dd" font-size="21">From raw signal to resolved incident — one deterministic platform.</text>
    <text x="73" y="281" fill="#5f89a8" font-size="15" letter-spacing="1.5">ICMP + SNMP COLLECTORS  ·  TIMESCALEDB  ·  TOPOLOGY CORRELATION  ·  RBAC + AUDIT</text>

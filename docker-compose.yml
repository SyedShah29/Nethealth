name: nethealth

services:
  postgres:
    image: timescale/timescaledb:2.19.3-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nethealth}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nethealth_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-nethealth_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}
      DATABASE_USER: ${DATABASE_USER:-nethealth_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    entrypoint:
      - sh
      - -c
      - exec docker-entrypoint.sh postgres -c "listen_addresses=$$(hostname -i)"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - private

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    entrypoint:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --bind "$$(hostname -i)" --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -h redis ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: nethealth-migrate
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nethealth}
      DATABASE_USER: ${POSTGRES_MIGRATION_USER:-nethealth_migrator}
      DATABASE_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}
      DATABASE_POOL_SIZE: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      METRICS_RAW_RETENTION_DAYS: ${METRICS_RAW_RETENTION_DAYS:-30}
      METRICS_FIVE_MINUTE_RETENTION_DAYS: ${METRICS_FIVE_MINUTE_RETENTION_DAYS:-180}
      METRICS_HOURLY_RETENTION_DAYS: ${METRICS_HOURLY_RETENTION_DAYS:-730}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  backend:
    build:
      context: ./backend
      target: runtime
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-nethealth-api}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nethealth}
      DATABASE_USER: ${DATABASE_USER:-nethealth_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://127.0.0.1:3000"]}
      ICMP_PROBE_ATTEMPTS: ${ICMP_PROBE_ATTEMPTS:-3}
      COLLECTOR_REACHABILITY_SECONDS: ${COLLECTOR_REACHABILITY_SECONDS:-30}
      COLLECTOR_HEALTH_SECONDS: ${COLLECTOR_HEALTH_SECONDS:-60}
      COLLECTOR_INTERFACES_SECONDS: ${COLLECTOR_INTERFACES_SECONDS:-60}
      COLLECTOR_OPTICAL_SECONDS: ${COLLECTOR_OPTICAL_SECONDS:-180}
      COLLECTOR_INVENTORY_SECONDS: ${COLLECTOR_INVENTORY_SECONDS:-1800}
      METRICS_RAW_RETENTION_DAYS: ${METRICS_RAW_RETENTION_DAYS:-30}
      METRICS_FIVE_MINUTE_RETENTION_DAYS: ${METRICS_FIVE_MINUTE_RETENTION_DAYS:-180}
      METRICS_HOURLY_RETENTION_DAYS: ${METRICS_HOURLY_RETENTION_DAYS:-730}
    command: ["uvicorn", "app.main:app", "--host", "backend-edge", "--port", "8000"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://backend-edge:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:
        aliases:
          - backend-edge
      private:
        aliases:
          - backend-private

  worker:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      SERVICE_NAME: nethealth-worker
      COLLECTOR_PROFILES_JSON: ${COLLECTOR_PROFILES_JSON:-{}}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
      - collector

  scheduler:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      SERVICE_NAME: nethealth-scheduler
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  syslog:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      SERVICE_NAME: nethealth-syslog
      SYSLOG_ENABLED: "true"
      SYSLOG_BIND_HOST: syslog-edge
      SYSLOG_PORT: 5514
    command: ["python", "-m", "app.cli.syslog_receiver"]
    ports:
      - "127.0.0.1:${SYSLOG_PORT:-5514}:5514/udp"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:
        aliases:
          - syslog-edge
      private:
        aliases:
          - syslog-private

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api}
    command: ["sh", "-c", "HOSTNAME=\"$$(hostname -i)\" exec node server.js"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://frontend:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true
  collector:
    driver: bridge

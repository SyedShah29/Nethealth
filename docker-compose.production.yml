services:
  backend:
    ports: !reset []
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: !reset []
  syslog:
    ports: !reset []
  reverse-proxy:
    image: nginx:1.27-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:${TLS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/run/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/run/tls/tls.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
